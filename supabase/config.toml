# Supabase local development configuration.
# Remote project: link with `npx supabase link --project-ref <ref>`
# Apply migrations: `npm run db:push` or `npm run db:migrate`

project_id = "gzydojyhkkdznxddggnv"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local-only. For the hosted project, set Site URL to the live domain in
# Dashboard → Authentication → URL Configuration (do not config-push this to prod).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[storage]
enabled = true
